[project]
name = "docflow"
version = "0.1.0"
description = "Grounded extraction and audit checks for GST invoices and bank statements"
authors = [
    { name = "Vedant Bhayani", email = "vedantbhayani29@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "faker>=40.43.0",
    "fastapi>=0.143.3",
    "mistralai>=3.2.0",
    "onnxruntime>=1.31.0",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=1.28.2",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "rapidfuzz>=3.14.6",
    "rapidocr>=3.10.0",
    "reportlab>=5.0.1",
    "uvicorn>=0.54.0",
    "zxing-cpp>=3.1.1",
]

[project.scripts]
docflow = "docflow.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
